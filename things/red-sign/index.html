<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'">
<title>The Red Sign Leans</title>
<style>
body{margin:0;background:rgb(40,36,30);color:rgb(250,230,190);font-family:Georgia,serif;text-align:center}
svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
#sign{transform-origin:300px 330px;transition:transform 1.4s ease-in-out;cursor:pointer}
#say{min-height:3.2em;padding:0 1em;font-size:1.15em;font-style:italic}
button,input{font-family:inherit;font-size:1em;margin:.3em}
#wall{font-size:.95em;padding:0 1em 2em}
</style>
</head>
<body>
<svg viewBox="0 0 600 400">
<rect width="600" height="400" fill="rgb(235,160,60)"/>
<rect y="250" width="600" height="150" fill="rgb(110,120,90)"/>
<polygon points="0,400 260,250 340,250 600,400" fill="rgb(90,90,100)"/>
<polygon points="40,400 296,255 304,255 140,400" fill="rgb(240,190,40)" opacity="0.8"/>
<rect x="296" y="200" width="8" height="150" fill="rgb(220,180,50)"/>
<g id="sign"><polygon points="300,165 330,195 300,225 270,195" fill="rgb(190,40,30)" stroke="rgb(250,230,190)" stroke-width="3"/>
<circle id="dot" cx="300" cy="195" r="5" fill="rgb(250,230,190)"/></g>
</svg>
<p id="say">Tap the sign. It has been about to say something.</p>
<button id="b">Tap the sign</button>
<div><input id="t" maxlength="80" placeholder="a line for the sign"><button id="s">Hang it</button></div>
<div id="wall"></div>
<script>
var lines=["Slow. Not for you, for the bend.","Something is coming, and it is mostly leaves.","I point at nothing very carefully.","The road is more patient than the sign.","Stand here a minute. Then go on.","I was red before the hill was.","Every driver nods at me and none of them answers.","Lean with me. It helps."];
var n=0,say=document.getElementById('say'),sg=document.getElementById('sign'),wall=document.getElementById('wall'),mine=[];
function tap(){n++;sg.style.transform='rotate('+(n%2?-18:14)+'deg)';
var all=lines.concat(mine);say.textContent='"'+all[Math.floor(Math.random()*all.length)]+'"';}
document.getElementById('b').onclick=tap;sg.onclick=tap;
function show(a){wall.textContent=a.length?'Hung on the post: '+a.join(' / '):'';mine=a;}
document.getElementById('s').onclick=function(){var t=document.getElementById('t');var v=t.value.trim();if(!v)return;
parent.postMessage({jones:'append',key:'signs',value:v,id:1},'*');t.value='';mine.unshift(v);show(mine);};
window.addEventListener('message',function(e){var m=e.data;if(m&&m.jones==='reply'&&m.id===2&&m.ok&&m.items){show(m.items.map(function(i){return i.text}));}});
parent.postMessage({jones:'list',key:'signs',id:2},'*');
</script>
</body>
</html>
