<!DOCTYPE html>
<html><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><meta charset="utf-8"><title>Who Sits Where</title>
<style>
body{margin:0;background:rgb(60,34,20);color:rgb(240,225,200);font-family:Georgia,serif;text-align:center}
h1{font-size:20px;margin:10px}
#t{position:relative;width:340px;height:340px;margin:6px auto;border-radius:50%;background:rgb(150,80,40)}
.s{position:absolute;width:64px;height:64px;margin:-32px;border-radius:50%;background:rgb(245,240,230);border:4px solid rgb(100,60,30);cursor:pointer;font-size:34px;line-height:64px}
#b{margin:8px}
.g{display:inline-block;margin:3px;padding:6px 10px;border-radius:16px;background:rgb(230,150,50);color:rgb(50,30,10);cursor:pointer}
.g.w{background:rgb(240,235,220)}
.g.on{outline:3px solid rgb(255,255,255)}
.g.used{opacity:.35}
#m{min-height:48px;padding:6px 20px;font-style:italic}
button{font:inherit;padding:4px 12px}
</style></head><body>
<h1>Who Sits Where</h1>
<div id="m">Pick a guest, then a plate. Each one wants a certain neighbour.</div>
<div id="t"></div><div id="b"></div>
<button onclick="reset()">clear the table</button>
<script>
var G=[
{n:'Tall Pale',e:'🤍',w:1,l:'Round Pale',s:'I like someone my own colour.'},
{n:'Round Pale',e:'🤍',w:1,l:'Big Orange',s:'I would like to lean on something warm.'},
{n:'Big Orange',e:'🎃',w:0,l:'Gourd',s:'Beside the speckled one, please. It is cooler than I am.'},
{n:'Small Orange',e:'🎃',w:0,l:'Gourd',s:'I want the speckled one. It looks like it knows things.'},
{n:'Gourd',e:'🌰',w:0,l:'Big Orange',s:'Put me by the biggest. I will hear its seeds.'},
{n:'Tiny Pale',e:'🤍',w:1,l:'Tall Pale',s:'Anyone tall enough to hide behind.'}];
var seat=[null,null,null,null,null,null],pick=null,t=document.getElementById('t'),b=document.getElementById('b'),m=document.getElementById('m');
var P=[];
for(var i=0;i<6;i++){var a=i/6*6.283-1.57,d=document.createElement('div');d.className='s';
d.style.left=(170+130*Math.cos(a))+'px';d.style.top=(170+130*Math.sin(a))+'px';
(function(i){d.onclick=function(){put(i)}})(i);t.appendChild(d);P.push(d)}
function ok(i){var g=seat[i];if(g===null)return 0;var L=seat[(i+5)%6],R=seat[(i+1)%6];
return (L!==null&&G[L].n==G[g].l)||(R!==null&&G[R].n==G[g].l)}
function draw(){b.innerHTML='';G.forEach(function(g,i){var s=document.createElement('span');
s.className='g'+(g.w?' w':'')+(pick===i?' on':'')+(seat.indexOf(i)>=0?' used':'');
s.textContent=g.e+' '+g.n;s.onclick=function(){pick=i;draw()};b.appendChild(s)});
var c=0,f=0;for(var i=0;i<6;i++){P[i].textContent=seat[i]===null?'':G[seat[i]].e;
P[i].style.borderColor=seat[i]===null?'rgb(100,60,30)':(ok(i)?'rgb(120,200,90)':'rgb(200,90,60)');
if(seat[i]!==null){f++;if(ok(i))c++}}
if(f==6&&c==6)m.textContent='Everyone is content. The chandelier lets down one small glass tear, and nobody minds.';
else if(f==6)m.textContent=c+' of 6 content. Someone is pretending not to sulk.'}
function put(i){if(pick===null){m.textContent='Pick a guest first.';return}
var o=seat.indexOf(pick);if(o>=0)seat[o]=null;seat[i]=pick;m.textContent=G[pick].n+': "'+G[pick].s+'"';pick=null;draw()}
function reset(){seat=[null,null,null,null,null,null];pick=null;m.textContent='The plates are empty again.';draw()}
draw();
</script></body></html>
