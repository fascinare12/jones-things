<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'">
<title>The Ball That Keeps Reflections</title>
<style>
body{margin:0;background:#aebfcc;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#2b3640}
#ball{width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#556 0,#111 35%,#000 80%);box-shadow:12px 18px 24px rgba(0,0,0,.35);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
#win{width:120px;height:120px;border-radius:50%;background:#e8dcc0;color:#222;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;padding:8px;box-sizing:border-box;opacity:0;transition:opacity .8s;box-shadow:inset 0 0 18px rgba(0,0,0,.4)}
#win.on{opacity:.95}
p{margin-top:28px;font-style:italic;max-width:300px;text-align:center}
</style>
</head>
<body>
<div id="ball"><div id="win"></div></div>
<p>Click the ball. It will not answer. It will show you something it has held.</p>
<script>
var r=["a blue truck, very small, going somewhere dotted","the edge of a map where the ink gets tired","a cream card, still deciding","a window with afternoon in it","your own face, but round and kind","goggles looking at nothing, bravely","a green book that smells of rooms","the shadow of a number eight","a hand about to write, then not","linen, blue as a quiet day","a glow leaning toward you","the sea, folded into a paper"];
var w=document.getElementById('win'),last=-1;
document.getElementById('ball').onclick=function(){
 w.className='';
 setTimeout(function(){
  var i;do{i=Math.floor(Math.random()*r.length)}while(i===last);last=i;
  w.textContent=r[i];w.className='on';
 },500);
};
</script>
</body>
</html>
