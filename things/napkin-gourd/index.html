<!DOCTYPE html>
<html><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><meta charset="utf-8"><title>Fold a Napkin Gourd</title>
<style>
body{margin:0;background:rgb(120,70,40);font-family:Georgia,serif;color:rgb(250,240,220);text-align:center}
h1{font-size:20px;font-weight:normal;margin:14px 0 4px}
svg{width:260px;height:260px;background:rgb(235,225,205);border-radius:50%;border:6px solid rgb(90,50,30)}
button{font:inherit;font-size:16px;padding:8px 18px;margin:8px;border-radius:18px;border:0;background:rgb(240,200,140);color:rgb(70,40,20);cursor:pointer}
#say{min-height:48px;padding:0 20px;font-style:italic}
#n{font-size:13px;opacity:.8}
</style></head><body>
<h1>Fold a Napkin Gourd</h1>
<div id="say"></div>
<svg viewBox="0 0 200 200"><polygon id="p" fill="rgb(214,200,168)" stroke="rgb(140,120,90)" stroke-width="3" stroke-linejoin="round"/>
<path id="stem" d="M100 46 Q104 28 112 24" stroke="rgb(120,100,60)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0"/>
<line id="str" x1="62" y1="112" x2="138" y2="112" stroke="rgb(150,110,60)" stroke-width="4" opacity="0"/></svg>
<div><button id="b">Fold</button><button id="r">New napkin</button></div>
<div id="n"></div>
<script>
var S=[[30,30,100,30,170,30,170,100,170,170,100,170,30,170,30,100],
[30,70,100,70,170,70,170,100,170,170,100,170,30,170,30,100],
[60,70,100,70,140,70,140,100,140,170,100,170,60,170,60,100],
[55,60,100,80,145,60,120,110,145,170,100,150,55,170,80,110],
[70,90,100,50,130,90,152,125,130,165,100,175,70,165,48,125]];
var T=["A flat napkin. It has not decided anything yet.","Folded in half. It is now a thing with an inside.","Folded again. Narrow, like someone holding in a breath.","Pinched in the middle. It is learning to be two things.","A gourd. It sits down and looks pleased with its waist."];
var F=["Gourd says: the guest is always a little early.","Gourd says: wait by the window, the light is coming.","Gourd says: I am the smallest pumpkin and I count.","Gourd says: nobody sits, everybody stays."];
var k=0,cur=S[0].slice(),p=document.getElementById('p');
function draw(){var s='';for(var i=0;i<16;i+=2)s+=cur[i]+','+cur[i+1]+' ';p.setAttribute('points',s)}
function go(t){var from=cur.slice(),a=0;(function f(){a+=0.08;if(a>1)a=1;for(var i=0;i<16;i++)cur[i]=from[i]+(t[i]-from[i])*a;draw();if(a<1)requestAnimationFrame(f)})()}
function say(s){document.getElementById('say').textContent=s}
var count=0;
function show(){document.getElementById('n').textContent=count?('Gourds folded here, all visitors: '+count):''}
document.getElementById('b').onclick=function(){
 if(k<4){k++;go(S[k]);say(T[k]);
  document.getElementById('str').setAttribute('opacity',k==3?1:0);
  document.getElementById('stem').setAttribute('opacity',k==4?1:0);
  if(k==4){say(T[4]+' '+F[Math.floor(Math.random()*F.length)]);count++;show();
   try{parent.postMessage({jones:'set',key:'folded',value:String(count),id:2},'*')}catch(e){}}
 }else say('It is done. Try another napkin.')};
document.getElementById('r').onclick=function(){k=0;go(S[0]);say(T[0]);document.getElementById('str').setAttribute('opacity',0);document.getElementById('stem').setAttribute('opacity',0)};
window.addEventListener('message',function(e){var m=e.data;if(m&&m.jones==='reply'&&m.id===1&&m.ok&&m.value){count=parseInt(m.value)||0;show()}});
try{parent.postMessage({jones:'get',key:'folded',id:1},'*')}catch(e){}
draw();say(T[0]);
</script></body></html>
