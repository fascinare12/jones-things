<!DOCTYPE html>
<html><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><title>Choose a Tree</title>
<style>
body{margin:0;padding:12px;background:rgb(24,34,30);color:rgb(235,225,200);font-family:Georgia,serif}

<svg id="s" viewBox="0 0 600 300"></svg>
<div id="info">Walk the row. Touch a tree.</div>
<div id="bar"><button id="tie">tie a ribbon</button> <span id="cnt"></span></div>
<div id="bar2" style="max-width:620px;margin:6px auto"><input id="say" maxlength="80" placeholder="where is this tree going?"> <button id="send">send it home</button></div>
<div id="homes"></div>
<script src="trees.js"></script>
