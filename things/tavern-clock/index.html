<!DOCTYPE html>
<html><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><meta charset="utf-8"><title>The Tavern Clock</title>
<style>
body{margin:0;background:#1d1510;color:#f0d9a8;font-family:Georgia,serif;text-align:center;padding:12px}
canvas{background:#2a1c12;border-radius:50%;border:6px solid #5a3b22;max-width:90%}
#name{font-size:22px;margin:10px 0 4px;color:#ffb347;min-height:30px}
#sub{font-size:14px;opacity:.8;min-height:20px}
button{background:#4a2f1a;color:#f0d9a8;border:1px solid #8a5a30;padding:8px 14px;margin:4px;border-radius:6px;font-family:inherit;cursor:pointer}
button:hover{background:#6a4326}
</style></head><body>
<canvas id="c" width="320" height="320"></canvas>
<div id="name"></div><div id="sub"></div>
<div><button id="back">Back an hour</button><button id="real">Real time</button><button id="fwd">Forward an hour</button></div>
<script>
var names=["the hour of the open door","the hour of the first candle","the hour of the turnip","the hour when the soup is thinking","the hour of small footsteps","the hour of the ghost's chair","the hour of held breath","the hour the lanterns are lit","the hour of the third pumpkin","the hour of crooked shadows","the hour of one more story","the hour of the door swinging both ways"];
var subs=["Something just came in.","A wick is deciding.","Pale and hard to carve.","Do not rush it.","Listen at the cobbles.","Leave it empty, politely.","Everything waits.","Amber on the stones.","It grins slightly.","They lean toward the door.","Just one.","Out goes one, in comes another."];
var offset=0,c=document.getElementById('c'),x=c.getContext('2d');
function hand(a,l,w,col){x.save();x.translate(160,160);x.rotate(a);x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(0,12);x.lineTo(0,-l);x.stroke();x.restore()}
function draw(){
var d=new Date(Date.now()+offset*3600000);
var h=d.getHours()%12,m=d.getMinutes(),s=d.getSeconds();
x.clearRect(0,0,320,320);
for(var i=0;i<12;i++){var a=i/12*Math.PI*2;x.save();x.translate(160,160);x.rotate(a);x.fillStyle=(i===h)?'#ff9a2e':'#c9a56a';x.beginPath();x.arc(0,-135,i===h?9:4,0,7);x.fill();x.restore()}
hand((h+m/60)/12*Math.PI*2,80,6,'#f0d9a8');
hand((m+s/60)/60*Math.PI*2,115,3,'#f0d9a8');
hand(s/60*Math.PI*2,120,1.5,'#d9602a');
x.fillStyle='#ffb347';x.beginPath();x.arc(160,160,6,0,7);x.fill();
document.getElementById('name').textContent=names[h];
document.getElementById('sub').textContent=subs[h];
}
document.getElementById('back').onclick=function(){offset--;draw()};
document.getElementById('fwd').onclick=function(){offset++;draw()};
document.getElementById('real').onclick=function(){offset=0;draw()};
setInterval(draw,1000);draw();
</script></body></html>
