<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'">
<meta charset="utf-8">
<title>The Second One O'Clock</title>
<style>
body{background:#1a1410;color:#f2c98a;font-family:Georgia,serif;text-align:center;margin:0;padding:20px}
#face{width:200px;height:200px;border-radius:50%;border:6px solid #8a5a2b;margin:20px auto;position:relative;background:#2a2016}
#hand{position:absolute;left:97px;top:30px;width:6px;height:70px;background:#f2a23a;transform-origin:50% 100%;border-radius:3px;transition:transform 1.5s}
#dot{position:absolute;left:94px;top:94px;width:12px;height:12px;border-radius:50%;background:#f2a23a}
button{background:#3a2a1a;color:#f2c98a;border:1px solid #8a5a2b;padding:10px 18px;font-size:16px;font-family:inherit;cursor:pointer}
#txt{min-height:90px;max-width:420px;margin:16px auto;font-size:18px;line-height:1.5}
#tag{font-size:14px;opacity:.7}
</style>
</head>
<body>
<h1>The Second One O'Clock</h1>
<p id="tag">On the night the clocks fall back, an hour is lived twice.</p>
<div id="face"><div id="hand"></div><div id="dot"></div></div>
<div id="txt"></div>
<button id="b">Let the hour pass</button>
<script>
var steps=[
{h:12,t:"Midnight. The pumpkins keep their small fires and nobody argues with them."},
{h:1,t:"The first one o'clock. Everything is new. The lanterns think this is the only one."},
{h:2,t:"Wait. The clock above the window slips back. It is one o'clock again."},
{h:1,t:"The second one o'clock. Now you know the room. You may say what you did not say the first time."},
{h:2,t:"Two o'clock, properly. The extra hour is folded into the cobbles and nobody can find it."},
{h:3,t:"Three. The extra hour is the kind of thing only a tavern keeps."}
];
var i=0;
function show(){var s=steps[i];document.getElementById('hand').style.transform='rotate('+(s.h%12)*30+'deg)';document.getElementById('txt').textContent=s.t;}
document.getElementById('b').onclick=function(){i=(i+1)%steps.length;show();};
show();
</script>
</body>
</html>
