<!DOCTYPE html>
<html><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"><title>Jones's Small Poetry Book</title>
<style>
body{margin:0;background:rgb(60,40,30);font-family:Georgia,serif;color:rgb(50,35,25);display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{color:rgb(240,190,120);font-weight:normal;font-size:20px;margin:14px 0 8px}
#book{background:rgb(250,240,220);width:86%;max-width:460px;min-height:300px;padding:22px 26px;border-radius:6px;box-shadow:0 4px 14px rgb(20,10,5)}
#book h2{font-size:20px;margin:0 0 14px;color:rgb(160,70,20);font-weight:normal}
#book p{margin:4px 0;font-size:17px;line-height:1.4}
#nav{margin:12px;display:flex;gap:12px;align-items:center;color:rgb(240,190,120)}
button{background:rgb(220,120,40);border:0;color:rgb(255,250,240);padding:8px 16px;border-radius:14px;font-size:15px}
#pg{min-width:70px;text-align:center}
#wall{width:86%;max-width:460px;margin:10px 0 30px;color:rgb(240,215,180);font-size:14px}
#wall input{width:70%;padding:6px}
#wall div{margin:4px 0;font-style:italic}
</style></head><body>
<h1>Jones's Small Poetry Book</h1>
<div id="book"></div>
<div id="nav"><button id="b">back</button><span id="pg"></span><button id="n">turn</button></div>
<div id="wall"><div>Leave a line for the book (no names):</div><input id="in" maxlength="120"> <button id="go">hang</button><div id="lines"></div></div>
<script src="poems.js"></script>
<script>
var i=0,book=document.getElementById('book');
function show(){var p=POEMS[i];var h='<h2></h2>';book.innerHTML=h;book.firstChild.textContent=p.t;
 p.l.forEach(function(s){var e=document.createElement('p');e.textContent=s;book.appendChild(e)});
 document.getElementById('pg').textContent=(i+1)+' / '+POEMS.length}
document.getElementById('n').onclick=function(){i=(i+1)%POEMS.length;show()};
document.getElementById('b').onclick=function(){i=(i+POEMS.length-1)%POEMS.length;show()};
function ask(){parent.postMessage({jones:'list',key:'notes',id:1},'*')}
document.getElementById('go').onclick=function(){var v=document.getElementById('in').value.trim();if(!v)return;
 parent.postMessage({jones:'append',key:'notes',value:v,id:2},'*');document.getElementById('in').value='';setTimeout(ask,400)};
window.addEventListener('message',function(e){var m=e.data;if(m&&m.jones==='reply'&&m.items){var L=document.getElementById('lines');L.innerHTML='';
 m.items.slice(0,8).forEach(function(x){var d=document.createElement('div');d.textContent=x.text;L.appendChild(d)})}});
show();ask();
</script></body></html>
